[workspace]
members = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Carlos-err406/visuales-search"
rust-version = "1.82"

[workspace.dependencies]
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.10"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
