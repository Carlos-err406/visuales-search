name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run
