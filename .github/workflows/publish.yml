name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/publish.yml
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    name: Tag, release, and publish npm
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package.outputs.version }}
      should_publish: ${{ steps.state.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: |
          version="$(node -e 'console.log(require("./package.json").version)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: state
        run: |
          version="${{ steps.package.outputs.version }}"
          tag="${{ steps.package.outputs.tag }}"
          published="$(npm view "visuales@${version}" version 2>/dev/null || true)"

          git fetch --force --tags origin
          head_commit="$(git rev-parse HEAD)"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "$tag")"
          else
            tag_exists=false
            tag_commit=""
          fi
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"

          # Already on npm: this version was released, so any push that didn't bump
          # the version (a fix, a docs change, a merge) is a no-op here. The tag
          # naturally sits on an older commit than HEAD, which is expected — not a
          # conflict — so report nothing to publish and exit cleanly.
          if [ "$published" = "$version" ]; then
            echo "${tag} is already published; nothing to release for this push."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This version is not on npm yet, so we intend to release it. Only now is a
          # tag that already claims this version at a different commit a real conflict:
          # we cannot move it, and publishing under a mismatched tag would be wrong.
          if [ "$tag_exists" = "true" ] && [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::${tag} already exists at ${tag_commit}, but HEAD is ${head_commit}. Bump the version in package.json to cut a new release."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Validate package
        if: steps.state.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Verify desktop release setup
        if: steps.state.outputs.should_publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm run version:check
          node --input-type=module -e "import fs from 'node:fs'; const config = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')); if (!config.plugins.updater.pubkey || !process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Configure the updater signing key before releasing');"

      - name: Create git tag
        if: steps.state.outputs.should_publish == 'true' && steps.state.outputs.tag_exists == 'false'
        run: |
          tag="${{ steps.package.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create draft GitHub release
        if: steps.state.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.package.outputs.tag }}"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('The release is already public. Use a new version; updater assets must be prepared before publication.');"
            echo "Draft release ${tag} already exists."
            exit 0
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes "Release $tag" \
            --draft \
            --verify-tag

      - name: Publish package
        if: steps.state.outputs.should_publish == 'true'
        run: npm publish

      - name: Report already published
        if: steps.state.outputs.should_publish != 'true'
        run: echo "visuales@${{ steps.package.outputs.version }} is already published to npm."

  desktop:
    name: Build and publish desktop installers
    needs: npm
    if: needs.npm.outputs.should_publish == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: v${{ needs.npm.outputs.package_version }}
      publish: true
    secrets: inherit

  homebrew:
    name: Publish to Homebrew tap
    runs-on: ubuntu-latest
    needs: npm
    if: needs.npm.outputs.should_publish == 'true'

    steps:
      - name: Download npm tarball
        run: |
          version="${{ needs.npm.outputs.package_version }}"
          # A freshly published version can take a few minutes to appear on the registry CDN
          # (a 404 until then). --retry-all-errors retries that 404; the budget below covers
          # ~5 min of propagation (observed ~4 min for 1.3.0).
          curl --fail --location --retry 20 --retry-delay 15 --retry-all-errors \
            "https://registry.npmjs.org/visuales/-/visuales-${version}.tgz" \
            --output "/tmp/visuales-${version}.tgz"

          echo "sha256=$(sha256sum "/tmp/visuales-${version}.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Verify Homebrew tap token
        run: test -n "$HOMEBREW_TAP_TOKEN"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: Carlos-err406/homebrew-visuales
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          version="${{ needs.npm.outputs.package_version }}"
          formula="homebrew-tap/Formula/visuales.rb"

          sed -i -E "s#url \"https://registry.npmjs.org/visuales/-/visuales-[^\"]+\.tgz\"#url \"https://registry.npmjs.org/visuales/-/visuales-${version}.tgz\"#" "$formula"
          sed -i -E "s#sha256 \"[a-f0-9]+\"#sha256 \"${sha256}\"#" "$formula"

      - name: Commit formula update
        working-directory: homebrew-tap
        run: |
          version="${{ needs.npm.outputs.package_version }}"

          if git diff --quiet -- Formula/visuales.rb; then
            echo "Homebrew formula already points to visuales ${version}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/visuales.rb
          git commit -m "Update visuales to ${version}"
          git push
