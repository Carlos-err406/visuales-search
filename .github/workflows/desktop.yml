name: Desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
          - os: macos-15-intel
            bundle: app
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: desktop-${{ matrix.os }}-${{ hashFiles('Cargo.toml') }}
          cache-bin: false
      - run: npm ci
      - name: Core and sidecar integration tests
        run: npm run check
      - name: Prepare tested sidecar
        run: node scripts/prepare-sidecar.mjs
      - name: Rust bridge tests
        run: cargo test --workspace --locked
      - name: Updater signature verification tests
        run: npm run test:signatures
      - name: Build application
        run: npm --prefix apps/desktop run tauri build -- --bundles ${{ matrix.bundle }} --config src-tauri/tauri.ci.conf.json
      - name: Verify macOS bundle signature and Node runtime
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-bundle.mjs

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run version:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-ui-failure
          path: .cache/desktop-ui
